version: 1

commands:
  nvim: nvim
  agent: claude --continue

workspaces:
  example-stack:
    - api
    - web
  search-feature:
    - repo: api
      worktree: search
      command: nvim
    - repo: web
      worktree: search
      command: [nvim, agent]
    - dir: ~/Projects/docs
      name: docs
      command: agent

repos:
  api: ~/Projects/example/api
  web: ~/Projects/example/web
